<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Light (ivory) is the default; dark only if the visitor chose it.
      // Runs before first paint so there's no flash of the wrong theme.
      (function () {
        try {
          if (localStorage.getItem('risch-theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
        // Scroll-revealed content starts hidden (styles/motion.css) only when
        // motion is allowed. If the app hasn't taken over within 3.5s (slow
        // network, script error), show everything rather than a blank page.
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          var html = document.documentElement;
          html.classList.add('js-motion');
          setTimeout(function () { if (!window.__motionReady) html.classList.add('motion-fallback'); }, 3500);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF6F0" />
    <!--
      Title, description, canonical, Open Graph / X tags and JSON-LD are
      written here per page by scripts/prerender.mjs at build time (and kept
      in sync on client-side navigation by src/components/RouteHead.jsx).
      Page copy lives in src/seo.js.
    -->
    <!--app-head-->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
